server {
    listen 80;
    server_name webapp.example.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name webapp.example.ru;

    access_log /var/log/nginx/webapp-access.log;
    error_log /var/log/nginx/webapp-error.log;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://ip.example.ru:22869;
        proxy_http_version 1.1;

        # Принудительно подставляем правильный Host
        proxy_set_header Host vds.example.ru;

        # Проброс IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Отключаем смену URL в редиректах
        proxy_redirect off;

        # Для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
location /api/ {
        proxy_pass http://ip.example.ru:22870;
        proxy_http_version 1.1;

        # Принудительно подставляем правильный Host
        proxy_set_header Host ip.example.ru;

        # Проброс IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Отключаем смену URL в редиректах
        proxy_redirect off;

        # Для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
